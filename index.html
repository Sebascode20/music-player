<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A responsive music player web application."
    />
    <meta name="author" content="Sebastian" />
    <meta
      name="keywords"
      content="music player, web app, Cosmo Sheldrake, Lost in the City Lights."
    />
    <meta name="title" content="Music player" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="preload" href="./resources/gradient-bg.jpg" as="image" />
    <title>Music Player | devChallenges.io</title>
  </head>
  <body>
    <main>
      <article class="card">
        <img
          class="card__musical-cover"
          src="./resources/cover-1.jpg"
          alt="musical cover"
          width="306"
          height="288"
        />
        <h1 class="card__music-title">Lost in the City Lights</h1>
        <p class="card__music-author">Cosmo Sheldrake</p>
        <div class="card__music-tempo">
          <time id="startMusicTempo" datetime="00:00">00:00</time>
          <time id="endMusicTempo" datetime="00:00">00:00</time>
        </div>
        <input
          id="progressBar"
          class="card__progressbar"
          type="range"
          min="0"
          max="100"
          value="0"
          step="1"
        />
        <div class="controls">
          <img
            id="prevButton"
            class="controls__stop-play-btn"
            src="./resources/Stop_and_play_fill-1.svg"
            alt="Stop and play button"
            width="32"
            height="32"
          />
          <img
            id="playButton"
            class="controls__play-btn"
            src="./resources/Play_fill.svg"
            alt="Play button"
            width="32"
            height="32"
          />
          <img
            id="nextButton"
            class="controls__stop-play-btn-reverse"
            src="./resources/Stop_and_play_fill_reverse.svg"
            alt="Stop and play button reverse"
            width="32"
            height="32"
          />
        </div>
      </article>
    </main>
    <footer class="author-info">
      Coded by <a href="#">Sebastian</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </footer>
    <script src="./js/music_player.js" defer></script>
  </body>
</html>
